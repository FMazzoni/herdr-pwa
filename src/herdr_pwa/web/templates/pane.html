{% set url = "/agent/" ~ (agent.session|urlencode) ~ "/pane" %}
<section id="agent-view" class="mirror" data-hp-poll="{{ url }}" hx-get="{{ url }}" hx-target="this" hx-swap="outerHTML" data-hp-topic="pane:{{ agent.session }}" hx-trigger="hp:stale, hp:poke from:body">
  <h2 class="sr-only">Terminal</h2>
  {# Run classes come from panetext's closed set; the text is escaped like any other. #}
  <pre class="pane">{% for line in view.lines %}<span class="pane__line{% if line.clip %} pane__line--clip{% endif %}">{% for run in line.runs %}<span class="{{ run.cls }}">{{ run.text }}</span>{% endfor %}</span>{% endfor %}</pre>
</section>
