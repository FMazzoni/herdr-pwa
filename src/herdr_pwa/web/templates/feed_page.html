{% extends "base.html" %}
{% block topbar %}<a class="topbar__link" href="/files">files</a><a class="topbar__link" href="/workspaces">workspaces</a><a class="topbar__link" href="/push">alerts</a>{% endblock %}
{% block body %}
{# The shell never reads the herd; the fragment does, and carries its own clock. #}
<main class="feed-host">
  <h1 class="sr-only">Herd</h1>
  {% set src = "/feed" ~ ("?ws=" ~ (ws|urlencode) if ws else "") %}
  <div id="feed-list" class="feed" data-hp-poll="{{ src }}" data-hp-topic="feed" hx-get="{{ src }}" hx-trigger="load" hx-target="this" hx-swap="outerHTML">
    <p class="boot" role="status">Reaching the herd&hellip;</p>
  </div>
</main>
<noscript><p class="boot">This dashboard refreshes with JavaScript; reload to see the herd.</p></noscript>
{% endblock %}
