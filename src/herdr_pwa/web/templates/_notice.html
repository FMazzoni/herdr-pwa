{# The one way a write's result is said: the failure table's sentence, then any confirm reason. #}
{% if refused is defined %}
<p class="banner {{ 'banner--held' if refused.held else 'banner--failure' }}" role="alert">
  <span class="banner__why">{{ says }}</span>
  {% if refused.reason %}<span class="banner__what">{{ refused.reason }}</span>{% endif %}
</p>
{% endif %}
