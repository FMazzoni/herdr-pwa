[project]
name = "herdr-pwa"
version = "2.0.0"
description = "A self-hosted phone dashboard for watching and driving herdr agents."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "markdown-it-py>=4.2.0",
    "segno>=1.6",
    "pywebpush>=2.0",
]

[project.scripts]
herdr-pwa = "herdr_pwa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_pwa"]

[dependency-groups]
dev = ["basedpyright", "pytest", "ruff", "complexipy", "httpx2", "datamodel-code-generator"]

[tool.complexipy]
max-complexity-allowed = 10
exclude = ["src/herdr_pwa/engine/generated/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
