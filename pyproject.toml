[project]
name = "herdr-pwa"
version = "2.0.0"
description = "A self-hosted phone dashboard for watching and driving herdr agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando Mazzoni" }]
keywords = ["herdr", "agents", "dashboard", "pwa", "tailscale", "self-hosted"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "markdown-it-py>=4.2.0",
    "segno>=1.6",
    "pywebpush>=2.0",
    "requests>=2.32",
    "urllib3>=2.2",
    "mdit-py-plugins>=0.6.1",
    "latex2mathml>=3.81.1",
    "linkify-it-py>=2.2.0",
    "pygments>=2.21.0",
    "pygit2>=1.20.1",
]



[project.urls]
Homepage = "https://github.com/FMazzoni/herdr-pwa"
Source = "https://github.com/FMazzoni/herdr-pwa"
Issues = "https://github.com/FMazzoni/herdr-pwa/issues"

[project.scripts]
herdr-pwa = "herdr_pwa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_pwa"]

# Agent tooling is tracked for contributors, but a source release does not need it.
[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/.agents"]

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "ruff",
    "complexipy",
    "httpx2",
    "datamodel-code-generator",
    "playwright>=1.63.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.170.5",
    "import-linter>=2.15",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7.0",
]

[tool.complexipy]
max-complexity-allowed = 10
exclude = ["src/herdr_pwa/engine/generated/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A marker no entry below registers is an error, so a misspelt resource never runs unguarded.
addopts = ["--strict-markers"]
# An expected failure that starts passing fails the run, so a fix is never hidden by its old mark.
xfail_strict = true
markers = [
    "browser: drives headless Firefox over the real app; reused, not run, while a receipt for this tree exists",
    # The resources a test may need, the only reasons a test is skipped: tests/conftest.py checks each.
    "live: needs the throwaway hp-test herdr session; `just live-tests` runs these",
    "corpus: needs a folder of real harness transcripts in HP_CORPUS",
    "nonroot: needs a user other than root, whom file permissions do not bind",
    "node: needs node on PATH",
    "git: needs a git checkout of this repo and git on PATH",
]

[tool.importlinter]
root_package = "herdr_pwa"

# Higher layers import lower ones, never the reverse; exhaustive, so a new module must pick a layer.
[[tool.importlinter.contracts]]
name = "The layers point down"
type = "layers"
containers = ["herdr_pwa"]
exhaustive = true
layers = [
    "cli",
    "web",
    "writes | notify | files",
    "decisions | render",
    "engine",
    "audit : pairing : devreport : facts : glyphs : patterns : notify_state : push : auth : tailscale : settings : statedir : clock : managed : panetext : process_start : protocol : validation : ids",
]

# The view composes the status, which reads the turns; an import the other way is a cycle.
[[tool.importlinter.contracts]]
name = "The chat view builds on its status, which builds on its turns"
type = "layers"
layers = [
    "herdr_pwa.web.chat_view",
    "herdr_pwa.web.chat_status",
    "herdr_pwa.web.chat",
]

# The foundations layer is non-independent, so this is what keeps its modules from a cycle.
[[tool.importlinter.contracts]]
name = "No import cycles between the top-level modules"
type = "acyclic_siblings"
ancestors = ["herdr_pwa"]
depth = 0

# The engine's modules import each other one way only, so a submodule never sees another half-built.
[[tool.importlinter.contracts]]
name = "No import cycles between the engine's modules"
type = "acyclic_siblings"
ancestors = ["herdr_pwa.engine"]
depth = 0

[[tool.importlinter.contracts]]
name = "Outside the engine, only its facade"
type = "protected"
protected_modules = ["herdr_pwa.engine.*"]
allowed_importers = ["herdr_pwa.engine"]

# The Claude reader's modules form one chain: records, lineage and turns, pages and tally, adapter.
[[tool.importlinter.contracts]]
name = "No import cycles between the Claude reader's modules"
type = "acyclic_siblings"
ancestors = ["herdr_pwa.engine.claude"]
depth = 0

# The adapters build on transcript.py and the facade registers them, so it never imports one.
[[tool.importlinter.contracts]]
name = "transcript.py imports no adapter"
type = "forbidden"
source_modules = ["herdr_pwa.engine.transcript"]
forbidden_modules = ["herdr_pwa.engine.claude", "herdr_pwa.engine.opencode", "herdr_pwa.engine.hermes"]
