[project]
name = "herdr-pwa"
version = "2.0.0"
description = "A self-hosted phone dashboard for watching and driving herdr agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando Mazzoni" }]
keywords = ["herdr", "agents", "dashboard", "pwa", "tailscale", "self-hosted"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "markdown-it-py>=4.2.0",
    "segno>=1.6",
    "pywebpush>=2.0",
    "requests>=2.32",
    "mdit-py-plugins>=0.6.1",
    "latex2mathml>=3.81.1",
    "linkify-it-py>=2.2.0",
    "pygments>=2.21.0",
    "pygit2>=1.20.1",
]



[project.urls]
Homepage = "https://github.com/FMazzoni/herdr-pwa"
Source = "https://github.com/FMazzoni/herdr-pwa"
Issues = "https://github.com/FMazzoni/herdr-pwa/issues"

[project.scripts]
herdr-pwa = "herdr_pwa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_pwa"]

# Agent tooling is tracked for contributors, but a source release does not need it.
[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/.agents"]

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "ruff",
    "complexipy",
    "httpx2",
    "datamodel-code-generator",
    "playwright>=1.63.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.170.5",
    "import-linter>=2.15",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7.0",
]

[tool.complexipy]
max-complexity-allowed = 10
exclude = ["src/herdr_pwa/engine/generated/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives headless Firefox over the real app; skipped while a receipt for this tree exists",
]

[tool.importlinter]
root_package = "herdr_pwa"

# Higher layers import lower ones, never the reverse; exhaustive, so a new module must pick a layer.
[[tool.importlinter.contracts]]
name = "The layers point down"
type = "layers"
containers = ["herdr_pwa"]
exhaustive = true
layers = [
    "cli",
    "web",
    "writes | notify | files",
    "decisions | render",
    "engine",
    "audit : pairing : devreport : notify_state : push : auth : tailscale : settings : statedir : clock : managed : panetext : process_start : protocol : validation : ids",
]

# The foundations layer is non-independent, so this is what keeps its modules from a cycle.
[[tool.importlinter.contracts]]
name = "No import cycles between the top-level modules"
type = "acyclic_siblings"
ancestors = ["herdr_pwa"]
depth = 0

[[tool.importlinter.contracts]]
name = "Outside the engine, only its facade"
type = "protected"
protected_modules = ["herdr_pwa.engine.*"]
allowed_importers = ["herdr_pwa.engine"]
