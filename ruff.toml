line-length = 100

[lint]
# Preview only for the rules named below: no preview rule or preview behaviour comes in by prefix.
preview = true
explicit-preview-rules = true
# Families picked for what they catch in agent-written code: ANN (annotation
# coverage), S (security), TRY (exception antipatterns), ARG (parameters left after
# a refactor), ERA (commented-out code), PL (pylint subset).
select = [
    "E", "W", "F", "I", "N", "UP",
    "ANN", "S", "B", "A", "C4", "DTZ", "T20",
    "ISC", "ICN", "PIE", "PT", "RET", "SIM", "TID",
    "ARG", "PTH", "ERA", "PL", "TRY", "PERF", "RUF",
    "ASYNC", "G", "LOG",
]
ignore = [
    "E501",    # the formatter owns line length
    # TRY003 wants a custom exception class for every message: a style opinion.
    # TRY002 (no bare Exception) stays on, so specific exception types still apply.
    "TRY003",
]
# RUF100 (unused noqa) stays on, so a suppression can't outlive its reason.
# BLE001 is not in a selected family, so it is named: a blind except hides the bug it catches.
# FBT003: a bare True or False at a call says nothing; FBT001 would flag parametrized tests.
# TC006: one spelling for cast, quoted, so the type need not exist at runtime.
# RUF039 (raw regex strings), RUF055 (a plain string needs no regex) and FURB167 (long flag
# names) are preview rules, named one by one so a ruff upgrade adds no other preview rule.
extend-select = ["BLE001", "FBT003", "TC006", "RUF039", "RUF055", "FURB167"]

[lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of a test
    "ANN201",  # test functions need no return annotation
    "PLR2004", # magic values are fine in assertions
]

# Validation happens where data enters: the wire, the state files, tailscaled and the routes.
"src/herdr_pwa/{audit,auth,devreport,notify_state,pairing,push,tailscale,validation}.py" = ["TID251"]
"src/herdr_pwa/engine/{client,hermes,holder,opencode,transcript,transport}.py" = ["TID251"]
"src/herdr_pwa/web/started.py" = ["TID251"]
"src/herdr_pwa/web/routers/*.py" = ["TID251"]
"{tests,scripts,.claude}/**" = ["TID251"]  # tests and tools read JSON freely

# Dev scripts talk to the operator on stdout and shell out to herdr by name.
"scripts/**" = ["T201", "S603", "S607"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"json.loads".msg = "Parse JSON with a pydantic model at the edge, so nothing untyped travels inward."
"json.load".msg = "Parse JSON with a pydantic model at the edge, so nothing untyped travels inward."
"pydantic.TypeAdapter".msg = "Validation belongs to the edge modules; inner code takes the typed value."
"pydantic.ValidationError".msg = "Only an edge module validates, so only an edge module catches a refusal."
"pydantic.validate_call".msg = "Validate once at the edge, not on every call."

[lint.pylint]
# Related values travel as one named type; 4 is the most any signature here takes.
max-args = 4
max-positional-args = 4
# Small enough to read in one screen; tests and scripts that run past it say why.
max-statements = 25

[format]
# Codegen owns generated/ and writes it at its own width; reformatting makes it stale.
exclude = ["src/herdr_pwa/engine/generated/**"]
docstring-code-format = true
