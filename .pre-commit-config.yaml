# Runs the project's own locked tools, so the hook matches `just check`.
# Install once per clone: `pre-commit install --hook-type pre-commit --hook-type commit-msg`,
# then `ln -s ../../scripts/hooks/pre_push.py .git/hooks/pre-push` (git, not pre-commit, runs it).
# ruff stays a pre-commit hook; the message check below runs only at commit-msg.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: commit-msg-shape
        name: commit message shape
        entry: python3 scripts/hooks/commit_msg.py
        language: system
        stages: [commit-msg]
      - id: ledger-repin
        name: ledger re-pin noted
        entry: python3 scripts/hooks/ledger_repin.py
        language: system
        files: ^tests/(test_ledger\.py|fixtures/ledger\.json)$
        pass_filenames: false
