# CI runs `just check` verbatim, so local and CI cannot drift apart.
name: check

on:
  push:
    branches: [main]
  pull_request:

# The gate only reads the tree.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, so a moved tag cannot change what runs; the tag is beside it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      # --locked fails on a uv.lock that pyproject.toml no longer matches, instead of rewriting it.
      - run: uv sync --locked --all-extras --dev
      - run: just check
